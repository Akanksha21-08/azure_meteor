version: '3.8'

services:
  # Database Service (Local MongoDB instance for Docker)
  mongodb:
    image: mongo:7.0
    container_name: jobverse_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobportal
    volumes:
      - mongo_data:/data/db
    networks:
      - jobverse_network

  # Backend REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jobverse_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/jobportal
      JWT_SECRET: super_secret_jwt_key_job_portal_2026_safe
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_job_portal_2026_safe
      JWT_EXPIRE: 30d
      CLIENT_URL: http://localhost:5173
      # Cloudinary Dummy Credentials (Replace with real values or leave to use local disk)
      CLOUDINARY_CLOUD_NAME: your_dummy_cloud_name
      CLOUDINARY_API_KEY: your_dummy_api_key
      CLOUDINARY_API_SECRET: your_dummy_api_secret
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads
    networks:
      - jobverse_network

  # Frontend React SPA Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobverse_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - server
    networks:
      - jobverse_network

volumes:
  mongo_data:
    driver: local
  server_uploads:
    driver: local

networks:
  jobverse_network:
    driver: bridge
